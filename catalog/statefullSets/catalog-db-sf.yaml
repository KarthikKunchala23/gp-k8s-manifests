---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-mysql
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/component: mysql
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/owner: retail-store-sample
spec:
  serviceName: catalog-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/component: mysql
      app.kubernetes.io/instance: catalog
      app.kubernetes.io/owner: retail-store-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/component: mysql
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/owner: retail-store-sample
    spec:
      serviceAccountName: catalog-mysql-sa
      containers:
        - name: mysql
          image: public.ecr.aws/docker/library/mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP           
          env:
            - name: MYSQL_DATABASE
              value: "catalogdb"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              export MYSQL_USER=$(cat /mnt/aws-secrets/MYSQL_USER)
              export MYSQL_PASSWORD=$(cat /mnt/aws-secrets/MYSQL_PASSWORD)
              export MYSQL_ROOT_PASSWORD=$(cat /mnt/aws-secrets/MYSQL_ROOT_PASSWORD)
              echo "Loaded secrets from AWS Secrets Manager. Starting MySQL..."
              exec docker-entrypoint.sh mysqld

          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: aws-secrets
              mountPath: /mnt/aws-secrets
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: aws-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: catalog-db-secrets