# Source: retail-store-sample-cart-chart/templates/dynamodb-deployment.yaml
{{- if and (-eq "dynamodb" .Values.app.persistence.provider) .Values.dynamodb.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "carts.dynamodb.fullname" . }}-deployment"
  labels: {{- include "carts.dynamodb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "carts.dynamodb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.dynamodb.podAnnotations }}
      annotations: 
        {{ toYaml . | nindent 8 }}
      {{- end }}
      labels: {{- include "carts.dynamodb.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "carts.dynamodb.fullname" . }}
          image: {{ .Values.dynamodb.image.repository }}:{{ .Values.dynamodb.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.dynamodb.image.pullPolicy }}
          ports:
            - name: dynamodb
              containerPort: 8000
              protocol: TCP
      {{- with .Values.dynamodb.nodeSelector }}
      nodeSelector:
        {{- toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.dynamodb.affinity }}
      affinity:
        {{ -toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.dynamodb.toleration }}
      toleration:
        {{- toYaml | nindent 8 }}
      {{- end }}
{{- end }}